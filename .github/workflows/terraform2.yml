name: Security Scan
on: [push, pull_request]
steps:
  - uses: actions/checkout@v4
  - name: Terraform Format Check
    run: terraform fmt -check -recursive
  - name: terraform Init
    run: terraform init
  - name: Terraform Validate
    run: terraform validate
  - name: Checkov Scan
    bridgecrewio/checkov-action@v12
    with: 
      directory: .
      soft_fail: false
  
